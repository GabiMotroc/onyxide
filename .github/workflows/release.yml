name: Build and Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get main commit SHA
        id: check
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "build-$(git rev-parse --short=12 HEAD)" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists for $(git rev-parse HEAD)"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Go
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows (amd64)
        if: steps.check.outputs.should_run == 'true'
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o onyxide.exe .

      - name: Build Linux (amd64)
        if: steps.check.outputs.should_run == 'true'
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o onyxide-linux .

      - name: Publish Release
        if: steps.check.outputs.should_run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.check.outputs.short }}
          name: "Build ${{ steps.check.outputs.sha }}"
          body: |
            **Built from commit** \`${{ steps.check.outputs.sha }}\`

            Artifacts:
            - \`onyxide.exe\` — Windows x86_64
            - \`onyxide-linux\` — Linux x86_64
          files: |
            onyxide.exe
            onyxide-linux
          fail_on_unmatched_files: true
